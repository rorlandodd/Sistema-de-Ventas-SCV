services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      INITIAL_DATABASE: ${INITIAL_DATABASE:-vacia}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ventas_data:/app/data
      - ventas_backups:/app/backups
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["dominio"]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  ventas_data:
  ventas_backups:
  caddy_data:
  caddy_config:
