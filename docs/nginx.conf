# Colocar DENTRO de un bloque server HTTPS ya configurado por tu proveedor.
# APP_URL debe coincidir exactamente con el dominio HTTPS del bloque server.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
}
